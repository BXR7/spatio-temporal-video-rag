[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatio-temporal-video-rag"
version = "0.1.0"
description = "Research prototype for spatio-temporal multimodal video retrieval"
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<0.130",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=10,<12",
  "qdrant-client==1.18.0",
  "transformers==4.57.6",
  "sentence-transformers==5.6.0",
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.47,<0.50",
  "faster-whisper>=1.1,<2",
  "scenedetect==0.7.1",
  "easyocr>=1.7,<2",
  "SpeechRecognition>=3.10,<4",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["api*", "ingestion*", "search*", "storage*", "evaluation*", "monitoring*", "runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires installed runtime dependencies or local services",
  "model: downloads/loads large ML models and may require CUDA",
]
